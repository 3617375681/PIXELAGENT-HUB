# PixelAgent Hub — backend (Records API) + dashboard (nginx → /api proxy)
# Usage: copy pixelagent-hub/.env.example to pixelagent-hub/.env, then:
#   docker compose up --build
services:
  backend:
    build:
      context: ./pixelagent-hub
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - ./pixelagent-hub/.env
    environment:
      NODE_ENV: production
      ALLOW_UNAUTH_IN_DEV: "false"
      RECORDS_API_PORT: "3100"
      RECORDS_ROOT_OVERRIDE: /app/records/company-mode
      STUDIO_ROOT_OVERRIDE: /app/records/company-mode/studio
    volumes:
      - ./pixelagent-hub/records:/app/records
    restart: unless-stopped

  frontend:
    build:
      context: ./pixelagent-hub/dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
