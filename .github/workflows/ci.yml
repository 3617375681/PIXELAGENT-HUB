name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  studio-browser:
    name: Studio real browser (Node 22)
    # Playwright's downloaded Chromium needs user namespaces for its renderer sandbox.
    # Pin the browser job; Ubuntu 24's default AppArmor policy blocks that binary.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./pixelagent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixelagent-hub/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Browser suites share runner resources; serialize files to avoid launch contention.
      - run: node --import tsx --test --test-concurrency=1 src/studio/browserRuns.test.ts src/studio/benchmark.test.ts src/studio/doctor.test.ts src/web/studioApi.test.ts
        env:
          RUN_STUDIO_BROWSER_TESTS: '1'

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    defaults:
      run:
        working-directory: ./pixelagent-hub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: pixelagent-hub/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm test

  dashboard:
    name: Dashboard (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pixelagent-hub/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixelagent-hub/dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Build API for single-service startup
        working-directory: ./pixelagent-hub
        run: |
          npm ci
          npm run build
      - name: Verify built dashboard and API startup
        working-directory: ./pixelagent-hub
        run: npm run smoke:dashboard

  windows-runtime:
    name: Windows runtime (Node 22)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./pixelagent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixelagent-hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm test
