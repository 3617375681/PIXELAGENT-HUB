name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-startup:
    name: Docker production startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: pixelagent-ci
      RECORDS_API_KEY: controlled-ci-production-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare controlled environment
        run: |
          cp pixelagent-hub/.env.example pixelagent-hub/.env
          printf '\nRECORDS_API_KEY=controlled-ci-production-key\nLLM_PROVIDER=mock\nENABLE_EMBEDDING_RETRIEVER=false\n' >> pixelagent-hub/.env
          printf 'VITE_RECORDS_API_KEY=DOCKER_BUILD_SECRET_CANARY\n' > pixelagent-hub/dashboard/.env.local
      - name: Build and start actual Compose services
        run: docker compose up --build -d
      - name: Verify protected API, built dashboard, source delivery and persistence
        run: node pixelagent-hub/scripts/smoke-docker.mjs
      - name: Show controlled service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop CI services
        if: always()
        run: docker compose down

  studio-browser:
    name: Studio real browser (Node 22)
    # Playwright's downloaded Chromium needs user namespaces for its renderer sandbox.
    # Pin the browser job; Ubuntu 24's default AppArmor policy blocks that binary.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./pixelagent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixelagent-hub/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Browser suites share runner resources; serialize files to avoid launch contention.
      - run: node --import tsx --test --test-concurrency=1 src/studio/browserRuns.test.ts src/studio/benchmark.test.ts src/studio/doctor.test.ts src/web/studioApi.test.ts
        env:
          RUN_STUDIO_BROWSER_TESTS: '1'

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    defaults:
      run:
        working-directory: ./pixelagent-hub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: pixelagent-hub/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm test

  dashboard:
    name: Dashboard (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pixelagent-hub/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixelagent-hub/dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Build API for single-service startup
        working-directory: ./pixelagent-hub
        run: |
          npm ci
          npm run build
      - name: Verify built dashboard and API startup
        working-directory: ./pixelagent-hub
        run: npm run smoke:dashboard
      - name: Verify portfolio replay artifacts
        run: npm run portfolio:demo -- --check
        working-directory: pixelagent-hub

  windows-runtime:
    name: Windows runtime (Node 22)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./pixelagent-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pixelagent-hub/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:package
      - run: npm test
