<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Snake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game-shell">
<h1>Pixel Snake</h1>
<div class="hud">
<span>Score: <span id="score">0</span></span>
<span id="status" role="status" aria-live="polite">Paused</span>
</div>
<canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
<div class="controls">
<button id="pauseBtn" type="button">Resume</button>
<button id="restartBtn" type="button">Restart</button>
</div>
<p class="hint">Arrow keys move the snake.</p>
</main>
<script src="game.js"></script>
</body>
</html>
